<style>

  .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; flex-shrink: 0; }
  .logo .mark { color: var(--text-3); font-weight: 500; }

  .nav-tabs::-webkit-scrollbar { display: none; }

  .tab-btn[aria-selected="true"] { background: #f4f4f5; color: var(--text); font-weight: 600; }

  .board-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .board-name .spec { font-size: 11px; color: var(--text-3); font-weight: 400; }
  .board-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #f4f4f5; color: var(--text-2); font-weight: 500; }
  .board-tag.旗舰 { background: #fee2e2; color: #991b1b; } .board-tag.高端 { background: #fef3c7; color: #92400e; }
  .board-tag.中端 { background: #e0f2fe; color: #0369a1; } .board-tag.入门 { background: #f4f4f5; color: var(--text-2); }
  .board-score { text-align: right; flex-shrink: 0; margin-left: 12px; }
  .board-score-num { font-size: 16px; font-weight: 700; color: var(--text); }
  .board-score-label { font-size: 10px; color: var(--text-3); }

  .skeleton { background: linear-gradient(90deg, #f4f4f5 0%, #e4e4e7 50%, #f4f4f5 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }

  .ann-date { font-size: 11px; color: var(--text-3); margin-top: 10px; }
  .ann-empty { padding: 48px 20px; text-align: center; font-size: 13px; color: var(--text-3); }

    <div class="card">

      </div>
      <div id="gpuBoardList"><div class="skeleton" style="height:600px;border-radius:10px;"></div></div>
    </div>
  </section>
</main>

<div class="sheet" id="sheet" role="dialog" aria-label="公告" aria-modal="true">

      let storageStr = storages.length > 0 ? storages.join(' / ') : '—';
      if (storages.length > 1) {
        const sNums = storages.map(s => s.match(/(\d+)\s*(GB|TB)/i)?.[0]);
        if (sNums.every(n => n)) storageStr = sNums.join(' / ');
      }
      
      let priceStr = '—';
      if (prices.length > 0) {
        const minP = Math.min(...prices), maxP = Math.max(...prices);
        priceStr = minP === maxP ? '¥' + minP.toLocaleString('zh-CN') : '¥' + minP.toLocaleString('zh-CN') + '-' + maxP.toLocaleString('zh-CN');
      }

      return { group_id: g.group_id, brand_id: g.brand_id, name: g.name, cpus, gpus, rams: ramStr, storages: storageStr, screens, weights, batteries, prices, priceStr, notes, _variants: vars };
    });
  }

  // Tab 切换与天梯懒加载
  function bindTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', 'false'));
        btn.setAttribute('aria-selected', 'true');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.view').forEach(v => v.classList.toggle('show', v.dataset.view === tab));
        
        // 懒加载天梯数据（直接渲染本地数组）
        if (tab === 'cpu-board') renderBoard('cpuBoardList', CPU_BOARD_DATA, false);
        if (tab === 'gpu-board') renderBoard('gpuBoardList', GPU_BOARD_DATA, true);
      });
    });
  }

  // 公告逻辑
  async function loadAnnouncements() {
    if (!sb) return;
    const { data: rows, error } = await sb.from('announcements').select('id, title, body, level, created_at').eq('is_active', true).order('created_at', { ascending: false }).limit(10);
    if (error) { console.error(error); return; }
    data.announcements = rows || [];
    updateBellDot();
    if ($('sheet').classList.contains('show')) renderSheetBody();
  }
  function updateBellDot() { const seen = getSeen(); $('bellDot').classList.toggle('show', data.announcements.some(a => !seen.includes(a.id))); }
  function renderSheetBody() {
    const body = $('sheetBody');
    if (!data.announcements.length) { body.innerHTML = '<div class="ann-empty">暂无公告</div>'; return; }
    body.innerHTML = data.announcements.map(a => {
      const tagText = { warning: '重要', update: '更新', info: '通知' }[a.level] || '通知';
      const level = ['warning', 'update', 'info'].includes(a.level) ? a.level : 'info';
      const date = new Date(a.created_at).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
      return `<div class="ann-item"><div class="ann-head"><span class="ann-tag ${level}">${tagText}</span><span class="ann-title">${escapeHtml(a.title)}</span></div><div class="ann-body">${escapeHtml(a.body)}</div><div class="ann-date">${date}</div></div>`;
    }).join('');
  }
  function openSheet() { markSeen(data.announcements.map(a => a.id)); renderSheetBody(); updateBellDot(); $('sheetMask').classList.add('show'); $('sheet').classList.add('show'); document.body.style.overflow = 'hidden'; }
  function closeSheet() { $('sheetMask').classList.remove('show'); $('sheet').classList.remove('show'); document.body.style.overflow = ''; }
  function bindSheet() { $('bellBtn').addEventListener('click', openSheet); $('sheetClose').addEventListener('click', closeSheet); $('sheetMask').addEventListener('click', closeSheet); }

  // 数据加载
  async function loadBrands() {
    if (!sb) return;
    const { data: rows } = await sb.from('brands').select('*').order('name');
    data.brands = rows || []; data.brandById = {}; data.brands.forEach(b => data.brandById[b.id] = b);
  }
  async function loadModels() {
    if (!sb) return;
    const { data: rows } = await sb.from('compare_models').select('*').order('price');
    data.models = rows || []; data.groupedModels = buildGroupedData(data.models);
  }

  // 机型渲染
  function renderBrandFilters() {
    const wrap = $('brandFilters'); const items = [{ id: 'all', name: '全部' }].concat(data.brands.map(b => ({ id: b.id, name: b.name })));
    wrap.innerHTML = items.map(b => `<button class="filter-chip" data-brand="${b.id}" aria-pressed="${String(state.filterBrand) === String(b.id)}">${escapeHtml(b.name)}</button>`).join('');
    wrap.querySelectorAll('.filter-chip').forEach(chip => chip.addEventListener('click', () => { state.filterBrand = chip.dataset.brand === 'all' ? 'all' : Number(chip.dataset.brand); renderBrandFilters(); renderModelPicks(); }));
  }
  function renderCpuGpuFilters() {
    const cpuSel = $('cpuFilter'), gpuSel = $('gpuFilter');
    const cpus = uniq(data.models.map(m => m.cpu)), gpus = uniq(data.models.map(m => m.gpu));
    cpuSel.innerHTML = '<option value="all">全部 CPU</option>' + cpus.map(c => `<option value="${escapeHtml(c)}" ${state.filterCpu === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('');
    gpuSel.innerHTML = '<option value="all">全部 GPU</option>' + gpus.map(g => `<option value="${escapeHtml(g)}" ${state.filterGpu === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('');
    cpuSel.classList.toggle('active', state.filterCpu !== 'all'); gpuSel.classList.toggle('active', state.filterGpu !== 'all');
  }
  function bindCpuGpuFilters() {
    $('cpuFilter').addEventListener('change', e => { state.filterCpu = e.target.value; renderCpuGpuFilters(); renderModelPicks(); });
    $('gpuFilter').addEventListener('change', e => { state.filterGpu = e.target.value; renderCpuGpuFilters(); renderModelPicks(); });
  }
  function getFilteredModels() {
    const kw = state.search.trim().toLowerCase();
    return data.groupedModels.filter(g => {
      if (state.filterBrand !== 'all' && String(g.brand_id) !== String(state.filterBrand)) return false;
      if (state.filterCpu !== 'all' && !g._variants.some(v => v.cpu === state.filterCpu)) return false;
      if (state.filterGpu !== 'all' && !g._variants.some(v => v.gpu === state.filterGpu)) return false;
      if (kw) { const b = data.brandById[g.brand_id]; if ((g.name + ' ' + (b ? b.name : '')).toLowerCase().indexOf(kw) === -1) return false; }
      return true;
    });
  }
  function renderModelPicks() {
    const wrap = $('modelPicks'); const list = getFilteredModels();
    if (!list.length) { wrap.innerHTML = '<div class="empty">没有匹配的机型</div>'; return; }
    wrap.innerHTML = list.map(g => {
      const brand = data.brandById[g.brand_id], selected = state.selectedModels.includes(g.group_id), disabled = !selected && state.selectedModels.length >= 3;
      const subParts = [];
      if (g.cpus.length > 0) subParts.push(g.cpus.length > 1 ? '多核可选' : g.cpus[0]);
      if (g.gpus.length > 0) subParts.push(g.gpus.length > 1 ? '多显卡可选' : g.gpus[0]);
      if (g.rams !== '—') subParts.push(g.rams);
      return `<button class="pick" data-id="${g.group_id}" aria-pressed="${selected}" ${disabled ? 'disabled' : ''}>
        <div class="pick-left"><div class="pick-title">${escapeHtml(g.name)}</div><div class="pick-sub">${escapeHtml(subParts.join(' · '))}</div></div>
        <div class="pick-right"><div class="pick-price">${g.priceStr}</div><div class="pick-brand">${escapeHtml(brand ? brand.name : '')}</div></div>
      </button>`;
    }).join('');
    wrap.querySelectorAll('.pick').forEach(chip => chip.addEventListener('click', () => {
      if (chip.disabled) return;
      const id = chip.dataset.id, idx = state.selectedModels.indexOf(id);
      if (idx !== -1) state.selectedModels.splice(idx, 1);
      else if (state.selectedModels.length < 3) state.selectedModels.push(id);
      renderModelPicks(); renderModelTable();
    }));
  }
  function renderModelTable() {
    const wrap = $('modelTableWrap');
    const selected = state.selectedModels.map(id => data.groupedModels.find(g => g.group_id === id)).filter(Boolean);
    $('modelClear').style.display = selected.length ? 'inline-block' : 'none';
    $('modelCount').textContent = selected.length ? `已选 ${selected.length} / 3` : '选择 2–3 款机型进行对比';
    if (!selected.length) { wrap.innerHTML = '<div class="empty">选择上方机型开始比较</div>'; return; }
    
    const minPrices = selected.map(g => g.prices.length ? Math.min(...g.prices) : Infinity);
    const minWeights = selected.map(g => g.weights.length ? Math.min(...g.weights) : Infinity);
    const globalMinPrice = Math.min(...minPrices), globalMinWeight = Math.min(...minWeights);

    const rows = [
      { label: '品牌', get: g => data.brandById[g.brand_id]?.name || '—' },
      { label: 'CPU', get: g => g.cpus.length ? g.cpus.join(' / ') : '—' },
      { label: 'GPU', get: g => g.gpus.length ? g.gpus.join(' / ') : '—' },
      { label: '内存', get: g => g.rams },
      { label: '硬盘', get: g => g.storages },
      { label: '屏幕', get: g => g.screens.length ? g.screens.join(' / ') : '—' },
      { label: '电池', get: g => g.batteries.length ? g.batteries.map(b => b + ' Wh').join(' / ') : '—' },
      { label: '重量', get: g => g.weights.length ? g.weights.map(w => Number(w).toFixed(2) + ' kg').join(' / ') : '—', best: g => g.weights.length && Math.min(...g.weights) === globalMinWeight },
      { label: '参考价', get: g => g.priceStr, best: g => g.prices.length && Math.min(...g.prices) === globalMinPrice },
      { label: '备注', get: g => g.notes.length ? g.notes[0] : '—' }
    ];

    let html = '<div class="table-wrap"><table class="ctable"><thead><tr><th>参数</th>';
    selected.forEach(g => html += `<th>${escapeHtml(g.name)}</th>`);
    html += '</tr></thead><tbody>';
    rows.forEach(row => {
      const hasAny = selected.some(g => row.get(g) !== '—');
      if (!hasAny) return;
      html += `<tr><td>${row.label}</td>`;
      selected.forEach(g => {
        const isBest = row.best && row.best(g) && selected.length > 1;
        html += `<td class="${isBest ? 'best' : ''}">${escapeHtml(row.get(g))}</td>`;
      });
      html += '</tr>';
    });
    wrap.innerHTML = html + '</tbody></table></div>';
  }

  // 品牌渲染
  function renderBrandPicks() {
    const wrap = $('brandPicks');
    if (!data.brands.length) { wrap.innerHTML = '<div class="empty">暂无品牌数据</div>'; return; }
    wrap.innerHTML = data.brands.map(b => {
      const selected = state.selectedBrands.includes(b.id), disabled = !selected && state.selectedBrands.length >= 3;
      return `<button class="pick" style="width:auto; padding:8px 16px; border-radius:100px; min-height:36px; flex-shrink:0;" data-id="${b.id}" aria-pressed="${selected}" ${disabled ? 'disabled' : ''}>${escapeHtml(b.name)}</button>`;
    }).join('');
    wrap.querySelectorAll('.pick').forEach(chip => chip.addEventListener('click', () => {
      if (chip.disabled) return;
      const id = Number(chip.dataset.id), idx = state.selectedBrands.indexOf(id);
      if (idx !== -1) state.selectedBrands.splice(idx, 1);
      else if (state.selectedBrands.length < 3) state.selectedBrands.push(id);
      renderBrandPicks(); renderBrandTable();
    }));
  }
  function renderBrandTable() { 
    const wrap = $('brandTableWrap');
    const selected = state.selectedBrands.map(id => data.brandById[id]).filter(Boolean);
    $('brandClear').style.display = selected.length ? 'inline-block' : 'none';
    $('brandCount').textContent = selected.length ? `已选 ${selected.length} / 3` : '选择 2–3 个品牌进行对比';
    if (!selected.length) { wrap.innerHTML = '<div class="empty">选择上方品牌开始比较</div>'; return; }
    let html = '<div class="table-wrap"><table class="ctable"><thead><tr><th>维度</th>';
    selected.forEach(b => html += `<th>${escapeHtml(b.name)}</th>`);
    html += '</tr></thead><tbody>';
    const rows = [
      { label: '所属国家', get: b => b.country || '—' },
      { label: '成立年份', get: b => b.founded || '—' },
      { label: '保修年限', get: b => b.warranty_years ? b.warranty_years + ' 年' : '—' },
      { label: '售后评分', get: b => b.service_score ? b.service_score + ' / 100' : '—' },
      { label: '可维修性', get: b => b.repairability_score ? b.repairability_score + ' / 100' : '—' },
      { label: '平台策略', get: b => b.platform_strategy || '—' }
    ];
    rows.forEach(row => {
      html += `<tr><td>${row.label}</td>`;
      selected.forEach(b => html += `<td>${escapeHtml(row.get(b))}</td>`);
      html += '</tr>';
    });
    wrap.innerHTML = html + '</tbody></table></div>';
  }

  function bindSearch() { $('modelSearch').addEventListener('input', e => { state.search = e.target.value; renderModelPicks(); }); }
  function bindClear() {
    $('modelClear').addEventListener('click', () => { state.selectedModels = []; renderModelPicks(); renderModelTable(); });
    $('brandClear').addEventListener('click', () => { state.selectedBrands = []; renderBrandPicks(); renderBrandTable(); });
  }

  // ================= 天梯榜渲染（纯前端本地数据） =================
  function renderBoard(wrapId, list, hasVram) {
    const wrap = $(wrapId);
    if (wrap.dataset.loaded) return;
    wrap.dataset.loaded = true;
    
    wrap.innerHTML = list.map((item, idx) => {
      let rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
      return `<div class="board-item">
        <div class="board-rank ${rankClass}">${idx + 1}</div>
        <div class="board-info">
          <div class="board-name">${escapeHtml(item.name)} <span class="board-tag ${item.tier}">${item.tier}</span></div>
          ${hasVram ? `<div class="board-name"><span class="spec">${escapeHtml(item.vram)}</span></div>` : ''}
        </div>
        <div class="board-score">
          <div class="board-score-num">${item.score.toLocaleString()}</div>
          <div class="board-score-label">${hasVram ? '3DMark' : 'Cinebench'}</div>
        </div>
      </div>`;
    }).join('');
  }
  // =======================================================

  async function init() {
    bindTabs(); bindSheet(); bindSearch(); bindClear(); bindCpuGpuFilters();
    if (!sb) return;
    loadAnnouncements();
    await loadBrands(); await loadModels();
    renderBrandFilters(); renderCpuGpuFilters(); renderModelPicks(); renderModelTable(); renderBrandPicks(); renderBrandTable();
  }
  init();
})();
</script>
</body>
</html>
